name: 使用问题
description: 接入、配置或使用过程中遇到的问题
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请先阅读 [README](https://github.com/ty-ux/data-permission#readme)、[接入指南](https://github.com/ty-ux/data-permission/blob/main/docs/integration.md) 和 [规则语义](https://github.com/ty-ux/data-permission/blob/main/docs/rule-semantics.md)。

  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 你想实现什么？现在卡在哪里？已经尝试过什么？
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 分支、JDK、Spring Boot、MyBatis / MyBatis-Plus 版本，是否 RuoYi
      placeholder: "feature/jdk17-mybatis-plus, JDK 17, Spring Boot 2.7.18, MyBatis-Plus 3.5.5, RuoYi-Vue"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置或代码
      description: 请脱敏后提供规则配置、Mapper 注解、application.yml 片段
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已阅读 README 和相关文档，并搜索过现有 Issue
          required: true
        - label: 内容不包含真实业务数据、账号、密钥或内网地址
          required: true
