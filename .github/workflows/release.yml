name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Verify
        run: mvn -B -ntp verify

      - name: Publish to GitHub Packages
        run: mvn -B -ntp -DskipTests deploy -s "${{ github.workspace }}/settings.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          cp data-permission-core/target/data-permission-core-[0-9]*.jar dist/
          cp data-permission-mybatis/target/data-permission-mybatis-[0-9]*.jar dist/
          cp data-permission-starter/target/data-permission-starter-[0-9]*.jar dist/
          rm -f dist/*-sources.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar --generate-notes
