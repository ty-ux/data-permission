server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:dp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: h2
  reasonable: false

data-permission:
  mode: ENFORCE
  default-policy: DENY
  no-subject-policy: ALLOW
  admin:
    enabled: true

logging:
  level:
    com.ty.dp: DEBUG
